name: Build Android APK

on:
  push:
    branches: [ main, develop ]
    tags:    [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # 允许在 GitHub 网页手动触发

jobs:
  build:
    name: Build & Sign APK (JDK 17 · AGP 8.7 · SDK 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ──────── 自动生成签名 keystore（确保 APK 可安装）────────
      # 使用 GitHub Actions Secret 中预置的 keystore 配置；
      # 首次使用时由开发者本地生成后上传到仓库 Settings > Secrets。
      # Secret 名称：ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Decode keystore from base64 secret
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/novacare-release.jks
          echo "Keystore decoded: $(ls -la app/novacare-release.jks)"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Generate debug keystore (CI only fallback)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          # 自动生成临时 keystore 用于 release 签名（仅供 CI 测试）
          keytool -genkey -v \
            -keystore app/novacare-release.jks \
            -alias novacare \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass novacare123 -keypass novacare123 \
            -dname "CN=NovaCare Auto, OU=CI, O=NovaCare, L=NA, ST=NA, C=NA" 2>&1 | head -3
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build Signed Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_FILE: app/novacare-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'novacare123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'novacare' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'novacare123' }}

      - name: Verify APK signature
        run: |
          set -e
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            apksigner verify --verbose app/build/outputs/apk/release/app-release.apk | head -10
            echo "✅ Release APK signature OK"
          fi
          apksigner verify app/build/outputs/apk/debug/app-debug.apk && echo "✅ Debug APK signature OK"

      - name: Inspect APK badging
        run: |
          echo "=== Debug APK info ==="
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | head -10 || aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -10
          echo "=== Release APK info ==="
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/release/app-release.apk 2>/dev/null | head -10 || aapt dump badging app/build/outputs/apk/release/app-release.apk | head -10
          echo "=== File sizes ==="
          ls -lh app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCare-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCare-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag, only non-prerelease)
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: true                 # 默认 draft，需手动发布
          prerelease: false
          body: |
            ⚠️ **本版本未经本地实机测试，可能存在运行问题**
            - 阅读 [INSTALL.md](https://github.com/chinazll/NovaCare/blob/main/INSTALL.md) 安装指南
            - 阅读 [DISCLAIMER.md](https://github.com/chinazll/NovaCare/blob/main/DISCLAIMER.md) 免责声明
            - 如有问题请提交 [Issue](https://github.com/chinazll/NovaCare/issues)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}