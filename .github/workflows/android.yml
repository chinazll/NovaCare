name: Build Android APK (with Rust NDK)

on:
  push:
    branches: [ main, develop ]
    tags:    [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK · JDK 17 · AGP 8.7 · SDK 35 · Rust NDK
    runs-on: ubuntu-latest
    timeout-minutes: 45  # NDK + Rust 编译需要更多时间

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          android-sdk-version: '35'
          packages: |
            platform-tools
            platforms;android-35
            platforms;android-34
            build-tools;35.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      # ===== Rust 工具链 =====
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'app/src/main/rust -> target'

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # ===== Gradle =====
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ===== 签名 keystore =====
      - name: Decode keystore from base64 secret
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/novacare-release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Generate debug keystore (CI fallback)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          keytool -genkey -v \
            -keystore app/novacare-release.jks \
            -alias novacare \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass novacare123 -keypass novacare123 \
            -dname "CN=NovaCare, OU=CI, O=NovaCare, L=NA, ST=NA, C=NA" 2>&1 | tail -2
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # ===== 验证 Rust 编译 =====
      - name: Verify Rust source compiles (sanity check)
        run: |
          cd app/src/main/rust
          cargo check --target x86_64-linux-android --release 2>&1 | tail -20
        env:
          CC_x86_64_linux_android: $ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: $ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang

      # ===== 构建 APK（Gradle 会自动通过 CMake 调用 cargo） =====
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Build Signed Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_FILE: app/novacare-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'novacare123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'novacare' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'novacare123' }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      # ===== 验证产物 =====
      - name: Verify APK signature
        run: |
          set +e
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner 2>/dev/null | head -1)
          [ -z "$APKSIGNER" ] && { echo "apksigner not found"; exit 0; }
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            $APKSIGNER verify --verbose app/build/outputs/apk/release/app-release.apk 2>&1 | head -10
            echo "✅ Release APK signature OK"
          fi
          $APKSIGNER verify app/build/outputs/apk/debug/app-debug.apk 2>&1 | head -3
          echo "✅ Debug APK signature OK"
        continue-on-error: true

      - name: Inspect APK badging
        run: |
          set +e
          AAPT=$(find $ANDROID_HOME/build-tools -name aapt 2>/dev/null | head -1)
          [ -z "$AAPT" ] && { echo "aapt not found"; exit 0; }
          echo "=== Debug ==="
          $AAPT dump badging app/build/outputs/apk/debug/app-debug.apk 2>&1 | head -6
          echo "=== Release ==="
          $AAPT dump badging app/build/outputs/apk/release/app-release.apk 2>&1 | head -6
          echo "=== Files ==="
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk 2>&1
          echo "=== Native libs (must contain libnovacare_core.so) ==="
          unzip -l app/build/outputs/apk/release/app-release.apk 2>&1 | grep -E "\.so" | head -10
        continue-on-error: true

      # ===== 上传产物 =====
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCare-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCare-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag, only non-prerelease)
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}