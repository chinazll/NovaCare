name: Build & Sign APK (Multi-Module · UniFFI)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Test · Sign (JDK 17 · Rust NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.1.10909125
      NDK_VERSION: 26.1.10909125

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK & NDK
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          if [ ! -d cmdline-tools/latest ]; then
            curl -sSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline.zip
            mv cmdline-tools cmdline-tools-latest
            mkdir -p cmdline-tools/latest
            mv cmdline-tools-latest/* cmdline-tools/latest/
            rm -f cmdline.zip
          fi
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          ls "$ANDROID_SDK_ROOT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/engine/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/engine/rust/Cargo.toml') }}

      # ==================== 测试金字塔第 1 层：Rust 单测 ====================
      - name: Rust unit tests
        run: |
          cd core/engine/rust
          cargo test --lib 2>&1 | tail -30

      - name: Rust clippy (warnings only)
        continue-on-error: true
        run: |
          cd core/engine/rust
          cargo clippy --lib --all-targets 2>&1 | tail -20 || true

      # ==================== 构建 Rust .so（真 NDK 交叉编译） ====================
      - name: Build Rust core for Android ABIs
        run: |
          set -e
          cd core/engine/rust
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../jniLibs build --release
          find ../jniLibs -name '*.so' -exec ls -lh {} \;

      # UniFFI Kotlin 侧加载的是 libuniffi_novacare.so（= uniffi_<namespace>）
      - name: Verify native library was produced
        run: |
          set -e
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ ! -f "core/engine/jniLibs/$abi/libuniffi_novacare.so" ]; then
              echo "::error::Missing libuniffi_novacare.so for $abi"
              exit 1
            fi
          done
          echo "All ABIs built successfully"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper is committed
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.12.1 --distribution-type bin
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/ || true
            git commit -m "chore: add Gradle Wrapper (auto-generated by CI)" || true
            git push origin HEAD:${GITHUB_REF_NAME} || true
          else
            echo "gradlew present"
          fi

      - name: Cache CI signing keystore
        id: ks-cache
        uses: actions/cache@v4
        with:
          path: .ci-keystore
          key: novacare-ci-keystore-v1

      - name: Restore or create signing keystore
        run: |
          set -e
          KS_DIR=.ci-keystore
          mkdir -p "$KS_DIR"
          if [ -f "$KS_DIR/password.txt" ]; then
            KS_PASS="$(cat "$KS_DIR/password.txt")"
          else
            KS_PASS="$(openssl rand -base64 24 | tr -d '\n')"
            printf '%s' "$KS_PASS" > "$KS_DIR/password.txt"
          fi
          if [ ! -f "$KS_DIR/novacare.jks" ]; then
            keytool -genkeypair -v \
              -keystore "$KS_DIR/novacare.jks" \
              -alias novacare \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=NovaCare CI, OU=CI, O=NovaCare, L=X, S=X, C=US"
          fi
          {
            echo "KEYSTORE_FILE=$KS_DIR/novacare.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=novacare"
            echo "KEY_PASSWORD=$KS_PASS"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$KS_PASS"

      # ==================== 测试金字塔第 2 层：Kotlin 单测（全模块） ====================
      - name: Kotlin unit tests (all modules)
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            */*/build/reports/tests/
          if-no-files-found: ignore

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCare-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Signed Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # ==================== 产物校验 ====================
      - name: Verify APK signature & native library
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | head -1)
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk && echo "release signature OK"
          "$APKSIGNER" verify app/build/outputs/apk/debug/app-debug.apk && echo "debug signature OK"
          echo "=== Rust 引擎是否真的进了 APK ==="
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            COUNT=$(unzip -l "$apk" | grep -c "libuniffi_novacare.so" || true)
            echo "$(basename $apk): libuniffi_novacare.so x${COUNT}"
            if [ "$COUNT" -lt 3 ]; then
              echo "::error::Rust engine missing from $apk (expected 3 ABIs)"
              exit 1
            fi
          done
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk | head -8
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCare-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
