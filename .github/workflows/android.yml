name: Build & Sign APK (Multi-Module · UniFFI)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Test · Sign (JDK 17 · Rust NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # GITHUB_TOKEN 默认是 read-only；显式声明 write 让 softprops/action-gh-release 能创建 release
    permissions:
      contents: write

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.1.10909125
      NDK_VERSION: 26.1.10909125

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK & NDK
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          if [ ! -d cmdline-tools/latest ]; then
            curl -sSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline.zip
            mv cmdline-tools cmdline-tools-latest
            mkdir -p cmdline-tools/latest
            mv cmdline-tools-latest/* cmdline-tools/latest/
            rm -f cmdline.zip
          fi
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          ls "$ANDROID_SDK_ROOT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/engine/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/engine/rust/Cargo.toml') }}

      # ==================== 测试金字塔第 1 层：Rust 单测 ====================
      - name: Rust unit tests
        run: |
          cd core/engine/rust
          cargo test --lib 2>&1 | tail -30

      - name: Rust clippy (warnings only)
        continue-on-error: true
        run: |
          cd core/engine/rust
          cargo clippy --lib --all-targets 2>&1 | tail -20 || true

      # ==================== 构建 Rust .so（真 NDK 交叉编译） ====================
      - name: Build Rust core for Android ABIs
        run: |
          set -e
          cd core/engine/rust
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../jniLibs build --release
          find ../jniLibs -name '*.so' -exec ls -lh {} \;

      # UniFFI Kotlin 侧加载的是 libuniffi_novacare.so（= uniffi_<namespace>）
      - name: Verify native library was produced
        run: |
          set -e
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ ! -f "core/engine/jniLibs/$abi/libuniffi_novacare.so" ]; then
              echo "::error::Missing libuniffi_novacare.so for $abi"
              exit 1
            fi
          done
          echo "All ABIs built successfully"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper is committed
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.12.1 --distribution-type bin
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/ || true
            git commit -m "chore: add Gradle Wrapper (auto-generated by CI)" || true
            git push origin HEAD:${GITHUB_REF_NAME} || true
          else
            echo "gradlew present"
          fi

      - name: Cache CI signing keystore
        id: ks-cache
        uses: actions/cache@v4
        with:
          path: .ci-keystore
          key: novacare-ci-keystore-v1

      - name: Restore or create signing keystore
        run: |
          set -e
          KS_DIR=.ci-keystore
          mkdir -p "$KS_DIR"
          if [ -f "$KS_DIR/password.txt" ]; then
            KS_PASS="$(cat "$KS_DIR/password.txt")"
          else
            KS_PASS="$(openssl rand -base64 24 | tr -d '\n')"
            printf '%s' "$KS_PASS" > "$KS_DIR/password.txt"
          fi
          if [ ! -f "$KS_DIR/novacare.jks" ]; then
            keytool -genkeypair -v \
              -keystore "$KS_DIR/novacare.jks" \
              -alias novacare \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=NovaCare CI, OU=CI, O=NovaCare, L=X, S=X, C=US"
          fi
          {
            echo "KEYSTORE_FILE=$KS_DIR/novacare.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=novacare"
            echo "KEY_PASSWORD=$KS_PASS"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$KS_PASS"

      # ==================== 测试金字塔第 2 层：Kotlin 单测（全模块） ====================
      - name: Kotlin unit tests (all modules)
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            */*/build/reports/tests/
          if-no-files-found: ignore

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCare-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Signed Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # ==================== 产物校验 ====================
      - name: Verify APK signature & native library
        run: |
          set +e  # 不让 verify 单条命令失败直接退，把所有信息收集完再判断
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | head -1)
          echo "=== APK 签名校验 ==="
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          RELEASE_RC=$?
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          DEBUG_RC=$?
          echo "release apksigner exit=$RELEASE_RC, debug apksigner exit=$DEBUG_RC"
          echo "=== Rust 引擎 ABI 数量 ==="
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            echo "--- $(basename $apk) ---"
            unzip -l "$apk" | grep -E "lib/.*\.so" || echo "(no .so found)"
            COUNT=$(unzip -l "$apk" | grep -c "libuniffi_novacare.so" || true)
            echo "libuniffi_novacare.so count: $COUNT"
            if [ "$COUNT" -lt 3 ]; then
              echo "::error::Rust engine missing from $apk (expected 3 ABIs)"
            fi
          done

          # ---- JNA 原生派发库守卫 ----
          # P0 事故复盘：UniFFI 的 Kotlin 绑定通过 JNA 调用 .so，而 JNA 依赖
          # libjnidispatch.so。曾因只依赖 jna 的普通 jar（不含 .so）导致
          # APK 里 libuniffi_novacare.so 齐全、jnidispatch 缺失，
          # Native.load() 抛 UnsatisfiedLinkError 被静默吞掉 →
          # 引擎永远不可用。这道守卫防止该问题再次静默回归。
          echo "=== JNA libjnidispatch.so 检查 ==="
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            echo "--- $(basename $apk) ---"
            unzip -l "$apk" | grep "libjnidispatch.so" || echo "(no jnidispatch found)"
            JCOUNT=$(unzip -l "$apk" | grep -c "libjnidispatch.so" || true)
            echo "libjnidispatch.so count: $JCOUNT"
            if [ "$JCOUNT" -lt 3 ]; then
              echo "::error::JNA native lib missing from $apk — Rust engine will never load"
            fi
          done

          echo "=== aapt badging ==="
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk | head -10
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
          # 决策：所有错误一起看
          if [ "$RELEASE_RC" -ne 0 ] || [ "$DEBUG_RC" -ne 0 ]; then
            echo "::error::One or more APK failed apksigner verify (release=$RELEASE_RC debug=$DEBUG_RC)"
            exit 1
          fi
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            C=$(unzip -l "$apk" | grep -c "libuniffi_novacare.so" || true)
            if [ "$C" -lt 3 ]; then
              echo "::error::Rust engine missing from $apk"
              exit 1
            fi
            J=$(unzip -l "$apk" | grep -c "libjnidispatch.so" || true)
            if [ "$J" -lt 3 ]; then
              echo "::error::JNA native lib missing from $apk — engine cannot load"
              exit 1
            fi
          done
          echo "All checks passed"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCare-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ==================== 自动发版（仅 tag 触发）====================
      # 用 gh CLI 直发：softprops/action-gh-release@v2 在 Draft 模式下经常无明显错误地
      # 静默吞掉失败（exit 0 但 release 没创建）。gh CLI 失败会显示 error 且非 0。
      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # gh CLI 同时认 GH_TOKEN 和 GITHUB_TOKEN（无需 setup-git）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          echo "=== gh auth status ==="
          gh auth status 2>&1 || true
          echo "=== current refs/tags ==="
          git tag --list | grep -F "$TAG" || true
          # 如果 release 已存在（重试场景），直接走 update 路径
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets only"
            gh release upload "$TAG" \
              app/build/outputs/apk/debug/app-debug.apk \
              app/build/outputs/apk/release/app-release.apk \
              --clobber
          else
            echo "=== creating release for $TAG ==="
            # 发布说明按 tag 动态查找：release-notes-v0.6.0-alpha.md 等。
            # 之前这里硬编码了 v0.5.0-alpha 的文件名 —— 换版本后会静默
            # 退回 "Release $TAG"，发布页看不到任何说明。
            NOTES_FILE="release-notes-${TAG}.md"
            if [ -f "$NOTES_FILE" ]; then
              echo "Using release notes: $NOTES_FILE"
            else
              # 退一步：取仓库里最新的一份 release notes（glob 展开后取最后一个）
              NOTES_FILE="$(ls -1 release-notes-*.md 2>/dev/null | sort -V | tail -1)"
              if [ -n "$NOTES_FILE" ]; then
                echo "Requested release-notes-${TAG}.md missing; falling back to $NOTES_FILE"
              else
                echo "No release notes file found; using placeholder text"
              fi
            fi
            if [ -n "$NOTES_FILE" ] && [ -f "$NOTES_FILE" ]; then
              NOTES="$(cat "$NOTES_FILE")"
            else
              NOTES="Release $TAG"
            fi
            # 显式 --latest 且**不加 --draft**：draft 状态对普通用户不可见，
            # 会让"release 明明建好了却打不开"。这里直接发布正式版。
            gh release create "$TAG" \
              --latest \
              --title "$TAG" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              app/build/outputs/apk/debug/app-debug.apk \
              app/build/outputs/apk/release/app-release.apk
          fi
          echo "=== final state ==="
          # 注意字段名是 isDraft / isPrerelease，不是 draft / prerelease。
          # 之前写 --json draft 会让 gh 直接报 "Unknown JSON field" 并以退出码 1 失败，
          # 于是整个 tag 构建**在产物已经上传成功之后**被判为失败。
          gh release view "$TAG" \
            --json tagName,name,isDraft,isPrerelease,assets \
            --jq '. | "tag=\(.tagName) name=\(.name) draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'
          # 守卫：release 必须有 ≥1 个资产，否则显式失败（避免"空 release"静默通过）
          ASSET_COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          if [ "$ASSET_COUNT" -lt 2 ]; then
            echo "::error::Release $TAG has only $ASSET_COUNT asset(s); expected 2 (debug + release APK)"
            exit 1
          fi
          echo "URL: https://github.com/${{ github.repository }}/releases/tag/$TAG"
