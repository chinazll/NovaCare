org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# KSP / Kotlin 编译守护进程独立堆，避免与 Gradle 守护进程争抢内存。
# 现象：多模块并行编译时 KSP 报 "failed to make parent directories"，
# Kotlin 守护进程报 "Connection to the Kotlin daemon has been unexpectedly lost"
# —— 都是堆耗尽后进程被杀的表象，不是代码问题。
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official
# 多模块并行时增量编译的缓存竞争会导致 KSP 目录创建失败
ksp.incremental=true
ksp.incremental.intermodule=true

# Room 导出 schema（便于迁移审计）
room.schemaLocation=$PROJECT_DIR/schemas
