[package]
name = "novacare_core"
version = "0.6.0"
edition = "2021"
authors = ["chinazll <noreply@github.com>"]
description = "NovaCare 确定性内核 —— 扫描 / 去重(BLAKE3) / 存储分析 / 电池分析"
license = "MIT"
repository = "https://github.com/chinazll/NovaCare"

[lib]
crate-type = ["cdylib"]
# 名字必须与 UniFFI Kotlin 绑定默认加载的库名一致（uniffi_<namespace>）：
# 生成代码里是 Native.load("uniffi_novacare")，若这里叫别的名字，
# 运行时会 UnsatisfiedLinkError —— 又是「编译成功但加载不到」那一类 bug。
name = "uniffi_novacare"

[dependencies]
# UniFFI：替代手写 JNI，自动生成 Kotlin 绑定
# 0.28 的 feature 名叫 cli（不是 builtin-bindgen）；本工程用独立的 uffigen 生成绑定，
# 所以这里只留默认 feature
uniffi = { version = "0.28.3" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
walkdir = "2.5"
thiserror = "1.0"
blake3 = "1.5"
log = "0.4"
once_cell = "1.20"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# 必须 unwind：UniFFI 与 panic 安全依赖 catch_unwind；
# 设为 abort 会让任何 panic 直接杀进程（= App 闪退）。
panic = "unwind"
strip = "symbols"

[profile.dev]
opt-level = 1
