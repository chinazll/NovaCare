[package]
name = "novacare_core"
version = "0.2.0"
edition = "2021"
authors = ["chinazll <noreply@github.com>"]
description = "NovaCare 管家 Rust 核心引擎"
license = "MIT"
repository = "https://github.com/chinazll/NovaCare"

[lib]
crate-type = ["cdylib"]
name = "novacare_core"

# ===== 依赖 =====
[target.'cfg(target_os = "android")'.dependencies]
# JNI 绑定（仅 Android 目标）
jni = { version = "0.21", default-features = false }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
walkdir = "2.5"
thiserror = "1.0"
blake3 = "1.5"
log = "0.4"
once_cell = "1.20"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[dev-dependencies]
tempfile = "3.10"

# ===== Profile 优化 =====
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[profile.dev]
opt-level = 1
debug = true