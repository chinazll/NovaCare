[package]
name = "novacare_core"
version = "0.3.0"
edition = "2021"
authors = ["chinazll <noreply@github.com>"]
description = "NovaCare 管家 Rust 核心引擎"
license = "MIT"
repository = "https://github.com/chinazll/NovaCare"

[lib]
crate-type = ["cdylib"]
name = "novacare_core"

# ===== 依赖 =====
[target.'cfg(target_os = "android")'.dependencies]
# JNI 绑定（仅 Android 目标）
jni = { version = "0.21", default-features = false }
# Android 日志
android_logger = "0.14"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
walkdir = "2.5"
thiserror = "1.0"
blake3 = "1.5"
log = "0.4"
once_cell = "1.20"

[dev-dependencies]
tempfile = "3.10"

# ===== Profile 优化 =====
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# 关键：必须 unwind 而非 abort。
# jni_bindings.rs 依赖 panic::catch_unwind 把 Rust panic 拦在 JNI 边界内；
# 若设为 abort，任何 panic 都会直接终止进程（= App 闪退），彻底摧毁安全契约。
panic = "unwind"
strip = "symbols"
debug = false

[profile.dev]
opt-level = 1
debug = true